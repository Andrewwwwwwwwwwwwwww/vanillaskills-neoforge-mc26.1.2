pluginManagement {
    repositories {
        maven { url 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}
plugins {
    // Lets Gradle auto-download the JDK versions MDG's internal tools ask for (e.g. Java 21).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'vanillaskills'
